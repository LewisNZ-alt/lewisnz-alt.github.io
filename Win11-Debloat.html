<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win11-Debloat | Safe Windows 11 Optimization</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #3182ce;
            --border: #30363d;
            --success: #238636;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 60px 20px 40px;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 25px;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: #0d1117;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            color: #ffffff;
        }

        section {
            margin: 40px 0;
        }

        h2 {
            color: #ffffff;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .card h3 {
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .steps {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px 20px 20px 40px;
        }

        .steps li {
            margin-bottom: 10px;
        }

        .code-container {
            position: relative;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1f242c;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .copy-btn {
            background-color: var(--border);
            color: var(--text-main);
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background-color 0.2s;
        }

        .copy-btn:hover {
            background-color: #484f58;
        }

        pre {
            padding: 15px;
            overflow-x: auto;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.9rem;
            color: #e6edf3;
        }

        footer {
            text-align: center;
            padding: 40px 0 20px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
